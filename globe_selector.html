<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Historya — Sélection Province</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#08061a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Nunito',sans-serif; }
.stars { position:fixed; inset:0; pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 10% 15%,rgba(255,255,255,0.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 30% 8%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 55% 20%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 75% 5%,rgba(255,255,255,0.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 90% 30%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 20% 80%,rgba(168,85,247,0.6) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 80% 75%,rgba(34,211,238,0.5) 0%,transparent 100%); }
.title { font-size:12px; font-weight:800; color:rgba(196,181,253,0.5); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:10px; }

/* Globe */
.globe-wrap {
  position:relative;
  width:680px;
  animation:float 6s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.globe-img { width:100%; display:block; position:relative; z-index:1;
  filter:drop-shadow(0 0 50px rgba(34,211,238,0.25)) drop-shadow(0 0 100px rgba(168,85,247,0.15)); }

/* Fresnel : anneau lumineux autour du globe */
.globe-wrap::before {
  content:'';
  position:absolute;
  inset: 5% 8%;
  border-radius:50%;
  background:transparent;
  box-shadow:
    0 0 40px 8px rgba(34,211,238,0.18),
    0 0 80px 20px rgba(168,85,247,0.12),
    0 0 120px 40px rgba(34,211,238,0.06);
  animation:fresnelPulse 4s ease-in-out infinite;
  z-index:0;
  pointer-events:none;
}
@keyframes fresnelPulse {
  0%,100% { box-shadow: 0 0 40px 8px rgba(34,211,238,0.18), 0 0 80px 20px rgba(168,85,247,0.12), 0 0 120px 40px rgba(34,211,238,0.06); }
  50%      { box-shadow: 0 0 50px 12px rgba(34,211,238,0.28), 0 0 100px 28px rgba(168,85,247,0.18), 0 0 160px 55px rgba(34,211,238,0.09); }
}

/* Zones */
.zone {
  position:absolute;
  width:140px; height:140px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  cursor:pointer;
  z-index:10;
}
.zone-ring {
  position:absolute; inset:-5px; border-radius:50%;
  border:2px solid var(--col);
  box-shadow:0 0 14px var(--col);
  opacity:0.7;
  animation:pulse 2.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.1)} }
.zone-dot {
  position:absolute; inset:0; border-radius:50%;
  background:var(--col); opacity:0.15;
  transition:opacity 0.3s;
}
.zone:hover .zone-dot { opacity:0.35; }
.zone:hover .zone-ring { opacity:1; box-shadow:0 0 24px var(--col), 0 0 48px var(--col); }
.zone:hover { transform:translate(-50%,-50%) scale(1.15); }

/* Tooltip */
.tip {
  position:absolute;
  bottom:calc(100% + 10px); left:50%;
  transform:translateX(-50%);
  min-width:150px;
  background:rgba(8,6,26,0.95);
  backdrop-filter:blur(20px);
  border:1px solid var(--col);
  border-radius:12px;
  padding:10px 14px;
  text-align:center;
  opacity:0; transition:opacity 0.2s;
  pointer-events:none;
  white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,0.7);
  z-index:50;
}
.zone:hover .tip { opacity:1; }
.tip::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:var(--col); }
.tip-emoji { font-size:18px; margin-bottom:3px; }
.tip-name  { font-size:13px; font-weight:900; color:#fff; }
.tip-sub   { font-size:10px; color:rgba(196,181,253,0.7); margin-top:1px; }
.tip-btn   { margin-top:7px; display:inline-block; background:linear-gradient(135deg,#7c3aed,#06b6d4); border-radius:9999px; padding:4px 12px; font-size:11px; font-weight:800; color:#fff; }

/* Fog of war */
.fog {
  position:absolute; inset:-5px; border-radius:50%;
  background:radial-gradient(circle, rgba(8,6,26,0.0) 0%, rgba(8,6,26,0.7) 60%, rgba(8,6,26,0.92) 100%);
  opacity:0; pointer-events:none;
  transition:opacity 0.6s ease;
  z-index:20;
}
.fog-ring {
  position:absolute; inset:-12px; border-radius:50%;
  background:radial-gradient(circle, rgba(30,15,60,0.0) 30%, rgba(30,15,60,0.85) 70%, rgba(8,6,26,0.95) 100%);
  opacity:0; pointer-events:none;
  transition:opacity 0.6s ease;
  animation:fogPulse 3s ease-in-out infinite;
  z-index:19;
}
@keyframes fogPulse { 0%,100%{opacity:0} 50%{opacity:0.15} }
.zone.fogged .fog { opacity:1; }
.zone.fogged .fog-ring { opacity:1; }
.zone.fogged .zone-ring { opacity:0.15; box-shadow:none; }
.zone.fogged .zone-dot { opacity:0.05; }
.zone.fogged { cursor:default; }
</style>
</head>
