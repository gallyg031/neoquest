<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon2.png" />
  <meta name="theme-color" content="#a855f7" />
  <title>Le Bazar du Hibou — NeoQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/xp.js"></script>
  <script src="data/data.js"></script>
  <link rel="stylesheet" href="assets/index.css" />
  <link rel="stylesheet" href="assets/boutique.css" />
</head>
<body>
<div class="stars"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<!-- NAVBAR -->
<nav class="relative z-50 w-full px-6 py-3 flex items-center justify-between">
  <a href="index_hidden.html" class="flex items-center gap-2 no-underline">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" stroke="url(#lg)" stroke-width="1.5"/><circle cx="16" cy="16" r="3" fill="url(#lg)"/><path d="M9 12L16 8L23 12L23 20L16 24L9 20Z" stroke="url(#lg)" stroke-width="1.5" fill="none"/><defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
    <span class="logo-text text-xl">NeoQuest TV</span>
  </a>
  <div class="hidden md:flex items-center gap-8">
    <a href="index_hidden.html" class="nav-link">← Le Phare</a>
  </div>
  <a href="profil.html" id="nav-profile" style="display:flex;align-items:center;gap:10px;text-decoration:none;background:rgba(0,0,0,0.35);border:1px solid rgba(168,85,247,0.25);border-radius:9999px;padding:5px 14px 5px 5px;transition:border-color 0.2s;" onmouseover="this.style.borderColor='rgba(168,85,247,0.55)'" onmouseout="this.style.borderColor='rgba(168,85,247,0.25)'">
    <div style="position:relative;flex-shrink:0;">
      <img id="nav-avatar" src="img/Neo_assis.png" alt="Profil" style="width:36px;height:36px;object-fit:contain;border-radius:50%;border:2px solid #22d3ee;background:rgba(168,85,247,0.15);padding:2px;" />
      <div id="nav-level-badge" style="position:absolute;bottom:-2px;right:-4px;background:#22d3ee;color:#08061a;font-size:9px;font-weight:900;padding:1px 5px;border-radius:9999px;border:1.5px solid #08061a;line-height:1.4;">1</div>
    </div>
  </a>
</nav>
<script>
  (function(){
    try {
      const p = JSON.parse(localStorage.getItem('neoquest_profile') || '{}');
      if(p.avatar) { const img = document.getElementById('nav-avatar'); if(img) { img.src = p.avatar; if(p.avatarStyle) img.style.filter = p.avatarStyle; } }
    } catch(e) {}
    try {
      const xp  = (typeof nqGetXP === 'function') ? nqGetXP() : 0;
      const lvl = (typeof nqGetLevel === 'function') ? nqGetLevel(xp) : {level:1,color:'#22d3ee'};
      document.getElementById('nav-level-badge').textContent = lvl.level;
      document.getElementById('nav-level-badge').style.background = lvl.color;
    } catch(e) {}
  })();
</script>

<!-- EN-TÊTE BAZAR -->
<section class="relative z-10 px-6 pt-8 pb-6">
  <div class="max-w-5xl mx-auto bazar-header">
    <div class="bazar-owl">
      <div class="bazar-owl-glow"></div>
      <div class="bazar-owl-emoji">🦉</div>
    </div>
    <div class="bazar-intro">
      <div class="badge mb-3">🏮 Le Bazar du Hibou</div>
      <h1 class="font-black text-3xl md:text-5xl mb-2" style="background:linear-gradient(135deg,#fbbf24 20%,#fde68a 60%,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-style:italic;">
        Trésors sauvés du Brouillard
      </h1>
      <p class="text-slate-400 text-base leading-relaxed max-w-xl">
        <span style="color:#fde68a;font-weight:800;">— Hou hou !</span> J'ai protégé ces merveilles de l'Oubli. Elles n'attendent que ton or pour pimper Neo.
      </p>
    </div>
  </div>
</section>

<!-- ONGLETS CATÉGORIES + BOURSE -->
<section class="relative z-10 px-6">
  <div class="max-w-5xl mx-auto bazar-tabs" role="tablist">
    <button class="bazar-tab active" data-cat="skins" role="tab">
      <span class="bazar-tab-emoji">🎭</span>
      <span class="bazar-tab-label">Skins de Neo</span>
    </button>
    <button class="bazar-tab" data-cat="consommables" role="tab">
      <span class="bazar-tab-emoji">🧪</span>
      <span class="bazar-tab-label">Consommables</span>
    </button>
    <div class="bazar-purse" title="Ton or actuel">
      <span class="bazar-purse-label">Ta bourse</span>
      <span class="bazar-purse-amount"><span class="bazar-purse-emoji">💰</span><span id="bazar-gold-amount">0</span></span>
    </div>
  </div>
</section>

<!-- GRILLE ITEMS -->
<section class="relative z-10 px-6 py-8 pb-24">
  <div class="max-w-5xl mx-auto">
    <div id="bazar-grid" class="bazar-grid"></div>
    <p id="bazar-empty" class="bazar-empty" style="display:none;">Le Hibou range cette étagère… reviens plus tard !</p>
  </div>
</section>

<!-- DIALOGUE NEO (apparaît après achat) -->
<div id="neo-comment" class="neo-comment-wrap" style="display:none;">
  <img src="img/Neo_assis.png" alt="Neo" class="neo-comment-avatar" />
  <div class="neo-comment-bubble">
    <span id="neo-comment-text"></span>
  </div>
</div>

<!-- MODALE CONFIRMATION ACHAT -->
<div id="bazar-confirm" class="bazar-modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="bazar-confirm-text">
  <div class="bazar-modal-backdrop"></div>
  <div class="bazar-modal-card">
    <button class="bazar-modal-close" type="button" aria-label="Annuler">×</button>
    <div class="bazar-modal-neo">
      <img src="img/Neo_assis.png" alt="Neo" />
      <div class="bazar-modal-bubble">
        <span id="bazar-confirm-text"></span>
      </div>
    </div>
    <div class="bazar-modal-preview">
      <div id="bazar-confirm-emoji" class="bazar-modal-emoji">🎁</div>
      <div id="bazar-confirm-name" class="bazar-modal-name">—</div>
      <div class="bazar-modal-price">
        <span class="bazar-price-emoji">💰</span>
        <span id="bazar-confirm-price">0</span>
        <span class="bazar-modal-price-after">— il te restera <strong id="bazar-confirm-rest">0</strong></span>
      </div>
    </div>
    <div class="bazar-modal-actions">
      <button id="bazar-cancel" class="bazar-modal-btn cancel" type="button">Annuler</button>
      <button id="bazar-confirm-buy" class="bazar-modal-btn confirm" type="button">✨ Je le prends !</button>
    </div>
  </div>
</div>

<!-- TOAST FEEDBACK -->
<div id="bazar-toast" class="bazar-toast" style="display:none;"></div>

<script src="js/boutique.js"></script>
</body>
</html>
