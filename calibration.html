<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#08061a; font-family:sans-serif; padding:20px; }
.wrap { position:relative; display:inline-block; width:100%; }
.wrap img { width:100%; display:block; }
.dot {
  position:absolute;
  width:40px; height:40px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:900; color:#fff;
  border:3px solid #fff;
  background:rgba(255,0,0,0.8);
  pointer-events:none;
  z-index:10;
}
#coords { color:#fff; margin-top:10px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <img id="map" src="img/Hist5Map.png" />
</div>
<div id="coords">Clique sur la carte pour voir les coordonnées exactes</div>

<script>
const POSITIONS = [
  [50, 8],   // dome
  [62, 18],  // croissant
  [87, 11],  // livre
  [53, 76],  // moulin
  [55, 45],  // beffroi
  [41, 59],  // bouclier
  [35, 72],  // galeres
  [63, 73],  // presse
  [52, 85],  // portail
];

const NOMS = ['dome','croissant','livre','moulin','beffroi','bouclier','galeres','presse','portail'];
const COLS = ['#f97316','#f97316','#f97316','#a855f7','#a855f7','#a855f7','#22c55e','#22c55e','#22c55e'];

const wrap = document.getElementById('wrap');
const img  = document.getElementById('map');

function placeDots() {
  wrap.querySelectorAll('.dot').forEach(d => d.remove());
  POSITIONS.forEach((pos, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.left = pos[0] + '%';
    dot.style.top  = pos[1] + '%';
    dot.style.background = COLS[i];
    dot.textContent = i+1;
    wrap.appendChild(dot);
  });
}

img.onload = placeDots;
if (img.complete) placeDots();

// Clic pour calibrer
wrap.addEventListener('click', e => {
  const r = img.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width * 100).toFixed(1);
  const y = ((e.clientY - r.top) / r.height * 100).toFixed(1);
  document.getElementById('coords').textContent = `Clic: left=${x}% top=${y}%`;
});
</script>
</body>
</html>
