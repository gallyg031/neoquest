<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon2.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#a855f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="img/Neo_assis-Photoroom.png" />
  <title>NeoQuest TV — Cours</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/xp.js"></script>
  <script src="data/data.js"></script>
  <style>
    :root { --bg:#08061a; --violet:#a855f7; --cyan:#22d3ee; --accent:#a855f7; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); font-family:'Nunito',sans-serif; color:#e2e8f0; overflow-x:hidden; }
    body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:9999; opacity:0.3; }

    /* Blobs */
    .blob { position:fixed; border-radius:50%; filter:blur(130px); pointer-events:none; z-index:0; }
    .blob-1 { width:550px; height:550px; background:rgba(168,85,247,0.15); top:-150px; left:-150px; }
    .blob-2 { width:400px; height:400px; background:rgba(34,211,238,0.08); bottom:-80px; right:-80px; }

    /* Navbar */
    nav { background:rgba(8,6,26,0.85); backdrop-filter:blur(20px); border-bottom:1px solid rgba(168,85,247,0.15); position:sticky; top:0; z-index:50; }
    .logo-text { background:linear-gradient(90deg,#a855f7,#22d3ee); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; font-weight:900; }
    .nav-link { color:#c4b5fd; font-weight:700; font-size:0.9rem; text-decoration:none; transition:color 0.2s; }
    .nav-link:hover { color:#fff; }

    /* ── BANNIÈRE HÉRO ── */
    .hero-banner {
      position: relative;
      z-index: 10;
      width: 100%;
      overflow: hidden;
      padding: 3rem 2rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }
    .hero-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-20, rgba(168,85,247,0.20)) 0%, transparent 60%);
      z-index: 0;
    }
    .hero-banner::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      z-index: 1;
    }
    .hero-banner-border {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent, #a855f7), transparent);
      opacity: 0.4;
      z-index: 2;
    }
    .hero-left {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .hero-right {
      position: relative;
      z-index: 3;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-logo {
      width: clamp(120px, 18vw, 200px);
      object-fit: contain;
      filter: drop-shadow(0 0 40px var(--accent, #a855f7));
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

    .breadcrumb { display:flex; align-items:center; gap:0.5rem; font-size:0.82rem; color:#64748b; }
    .breadcrumb a { color:#94a3b8; text-decoration:none; transition:color 0.2s; }
    .breadcrumb a:hover { color:#c4b5fd; }

    .mat-title {
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1;
      color: #fff;
    }
    .mat-subtitle { color:#94a3b8; font-size:1rem; font-weight:600; margin-top:0.3rem; }

    /* ── CONTENU ── */
    main { position:relative; z-index:10; max-width:900px; margin:0 auto; padding:2rem 1.5rem 4rem; }

    /* Niveaux */
    .niveaux-label { font-size:0.82rem; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.8rem; }
    .niveau-btn {
      border: 2px solid rgba(168,85,247,0.3);
      border-radius: 9999px;
      padding: 0.6rem 1.6rem;
      font-weight: 800;
      font-size: 0.95rem;
      color: #c4b5fd;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Nunito', sans-serif;
    }
    .niveau-btn:hover { background:rgba(168,85,247,0.15); border-color:rgba(168,85,247,0.6); color:#fff; }
    .niveau-btn.active { color:#fff; }

    /* Thème block */
    .theme-block {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(168,85,247,0.15);
      border-radius: 1.25rem;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .theme-header {
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid rgba(168,85,247,0.1);
    }
    .theme-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .theme-count {
      margin-left: auto;
      font-size: 0.75rem;
      font-weight: 700;
      color: #475569;
      background: rgba(255,255,255,0.04);
      border-radius: 9999px;
      padding: 0.2rem 0.7rem;
    }

    /* Chapitre link */
    .chapitre-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      text-decoration: none;
      color: inherit;
      transition: background 0.2s;
    }
    .chapitre-link:last-child { border-bottom: none; }
    .chapitre-link:hover { background: rgba(168,85,247,0.07); }
    .chapitre-play {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 0.7rem;
    }
    .chapitre-name { font-weight: 700; color: #e2e8f0; font-size: 0.98rem; }
    .pills { display:flex; gap:0.4rem; flex-wrap:wrap; flex-shrink:0; }
    .pill {
      display: inline-flex; align-items: center; gap: 0.25rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 9999px;
      padding: 0.2rem 0.6rem;
      font-size: 0.68rem;
      font-weight: 700;
      color: #64748b;
    }

    /* Vide */
    #empty-state { text-align:center; padding:5rem 0; }

    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:#08061a; }
    ::-webkit-scrollbar-thumb { background:linear-gradient(var(--violet),var(--cyan)); border-radius:3px; }
  </style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<!-- NAVBAR -->
<nav class="w-full px-6 py-4 flex items-center justify-between">
  <a href="index.html" class="flex items-center gap-2 no-underline">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" stroke="url(#lg)" stroke-width="1.5"/><circle cx="16" cy="16" r="3" fill="url(#lg)"/><path d="M9 12L16 8L23 12L23 20L16 24L9 20Z" stroke="url(#lg)" stroke-width="1.5" fill="none"/><defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
    <span class="logo-text text-xl">NeoQuest</span>
  </a>
  <a href="index.html" class="nav-link">← Accueil</a>
  <a href="profil.html" id="nav-profile" title="Mon profil" style="display:flex;align-items:center;gap:0.5rem;text-decoration:none;">
    <img id="nav-avatar" src="img/Neo_assis-Photoroom.png" alt="Profil" style="width:34px;height:34px;object-fit:contain;border-radius:50%;border:2px solid rgba(168,85,247,0.5);background:rgba(168,85,247,0.1);padding:2px;transition:border-color 0.2s;" onmouseover="this.style.borderColor='rgba(34,211,238,0.8)'" onmouseout="this.style.borderColor='rgba(168,85,247,0.5)'" />
    <span id="nav-pseudo" style="font-size:0.8rem;font-weight:700;color:#c4b5fd;display:none;"></span>
  </a>
</nav>
<script>
  (function(){
    try {
      const p = JSON.parse(localStorage.getItem('neoquest_profile') || '{}');
      if(p.avatar) { const img = document.getElementById('nav-avatar'); if(img) { img.src = p.avatar; if(p.avatarStyle) img.style.filter = p.avatarStyle; } }
      if(p.pseudo) { const el = document.getElementById('nav-pseudo'); if(el) { el.textContent = p.pseudo; el.style.display = 'inline'; } }
    } catch(e) {}
  })();
</script>

<!-- BANNIÈRE HÉRO -->
<div class="hero-banner" id="hero-banner">
  <div class="hero-left">
    <div class="breadcrumb">
      <a href="index.html">Accueil</a>
      <span>›</span>
      <span id="bc-matiere" style="font-weight:800;"></span>
    </div>
    <h1 class="mat-title" id="mat-nom"></h1>
    <p class="mat-subtitle" id="mat-subtitle"></p>
  </div>
  <div class="hero-right">
    <img id="mat-logo" class="hero-logo" src="" alt="" style="display:none;" />
  </div>
  <div class="hero-banner-border"></div>
</div>

<!-- CONTENU -->
<main>

  <!-- Niveaux -->
  <div class="mb-8">
    <p class="niveaux-label">Choisis ton niveau</p>
    <div id="niveaux-tabs" class="flex flex-wrap gap-3"></div>
  </div>

  <!-- Thèmes -->
  <div id="themes-container"></div>

  <!-- Vide -->
  <div id="empty-state" class="hidden">
    <div style="font-size:3.5rem;margin-bottom:1rem;">🚧</div>
    <p class="font-black text-xl text-white mb-2">Contenu en cours de préparation</p>
    <p style="color:#64748b;">Reviens bientôt, Neo prépare les cours !</p>
  </div>

</main>

<script>
  const params    = new URLSearchParams(window.location.search);
  const matiereId = params.get('matiere');
  let matiereData = null;
  let couleur     = '#a855f7';

  (function() {
    const data = window.__neoData;
    matiereData = data.matieres.find(m => m.id === matiereId);
    if (!matiereData) { window.location.href = 'index.html'; return; }

    couleur = matiereData.couleur || '#a855f7';

    // Couleurs dynamiques
    document.documentElement.style.setProperty('--accent', couleur);
    document.getElementById('hero-banner').style.background =
      `linear-gradient(135deg, ${couleur}28 0%, ${couleur}0a 50%, transparent 100%)`;
    document.querySelector('.blob-1').style.background = couleur + '22';

    // Textes
    document.title = `NeoQuest TV — ${matiereData.nom}`;
    document.getElementById('bc-matiere').textContent = matiereData.nom;
    document.getElementById('bc-matiere').style.color = couleur;
    document.getElementById('mat-nom').textContent = matiereData.nom;

    const niveauxCount = matiereData.niveaux?.length || 0;
    const chapCount = matiereData.niveaux?.flatMap(n => n.themes?.flatMap(t => t.chapitres) || []).length || 0;
    document.getElementById('mat-subtitle').textContent =
      niveauxCount > 0 ? `${niveauxCount} niveau${niveauxCount > 1 ? 'x' : ''} · ${chapCount} chapitre${chapCount > 1 ? 's' : ''}` : '';

    // Logo
    if (matiereData.logo) {
      const logoEl = document.getElementById('mat-logo');
      logoEl.src = matiereData.logo;
      logoEl.alt = matiereData.nom;
      logoEl.style.display = 'block';
      logoEl.style.filter = `drop-shadow(0 0 40px ${couleur}cc)`;
    }

    // Niveaux tabs
    if (!matiereData.niveaux || matiereData.niveaux.length === 0) {
      document.getElementById('empty-state').classList.remove('hidden');
    } else {
      const tabs = document.getElementById('niveaux-tabs');
      matiereData.niveaux.forEach((niv, i) => {
        const btn = document.createElement('button');
        btn.className = `niveau-btn ${i === 0 ? 'active' : ''}`;
        btn.textContent = niv.nom;
        if (i === 0) {
          btn.style.background = couleur + '30';
          btn.style.borderColor = couleur + 'aa';
          btn.style.color = '#fff';
        }
        btn.addEventListener('click', () => {
          document.querySelectorAll('.niveau-btn').forEach(b => {
            b.classList.remove('active');
            b.style.background = 'transparent';
            b.style.borderColor = 'rgba(168,85,247,0.3)';
            b.style.color = '#c4b5fd';
          });
          btn.classList.add('active');
          btn.style.background = couleur + '30';
          btn.style.borderColor = couleur + 'aa';
          btn.style.color = '#fff';
          renderThemes(niv);
        });
        tabs.appendChild(btn);
      });
      renderThemes(matiereData.niveaux[0]);
    }
  })();

  function renderThemes(niveau) {
    const container = document.getElementById('themes-container');
    container.innerHTML = '';

    if (!niveau.themes || niveau.themes.length === 0) {
      container.innerHTML = '<p style="color:#475569;text-align:center;padding:3rem 0;">Aucun thème disponible pour ce niveau.</p>';
      return;
    }

    niveau.themes.forEach(theme => {
      const block = document.createElement('div');
      block.className = 'theme-block';

      const chapitresHTML = theme.chapitres.map(chap => `
        <a href="chapitre.html?matiere=${matiereId}&niveau=${niveau.id}&chapitre=${chap.id}" class="chapitre-link">
          <div style="display:flex;align-items:center;gap:0.9rem;">
            <div class="chapitre-play" style="background:${couleur}22;border:1.5px solid ${couleur}55;">
              <span style="color:${couleur};margin-left:2px;">▶</span>
            </div>
            <span class="chapitre-name">${chap.nom}</span>
          </div>
          <div class="pills">
            <span class="pill">🎬 Vidéo</span>
            <span class="pill">📄 Fiche</span>
            <span class="pill">🃏 ${chap.flashcards?.length || 0}</span>
            <span class="pill">❓ ${chap.quiz?.length || 0}</span>
          </div>
        </a>
      `).join('');

      block.innerHTML = `
        <div class="theme-header">
          <div class="theme-dot" style="background:${couleur};box-shadow:0 0 8px ${couleur}88;"></div>
          <h2 style="font-weight:900;font-size:1.05rem;color:#fff;">${theme.nom}</h2>
          <span class="theme-count">${theme.chapitres.length} chapitre${theme.chapitres.length > 1 ? 's' : ''}</span>
        </div>
        <div>${chapitresHTML}</div>
      `;
      container.appendChild(block);
    });
  }
</script>
<script>
  if("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js")
      .then(() => console.log("[NeoQuest] Service Worker enregistré"))
      .catch(e => console.warn("[NeoQuest] SW erreur:", e));
  }
</script>
</body>
</html>
