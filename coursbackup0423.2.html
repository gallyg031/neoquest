<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon2.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#a855f7" />
  <link rel="apple-touch-icon" href="img/Neo_assis.png" />
  <title>NeoQuest TV — Royaume</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/xp.js"></script>
  <script src="data/data.js"></script>
  <style>
    :root { --bg:#08061a; --violet:#a855f7; --cyan:#22d3ee; --accent:#a855f7; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); font-family:'Nunito',sans-serif; color:#e2e8f0; overflow-x:hidden; padding-bottom:90px; }
    body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:9999; opacity:0.3; }
    .blob { position:fixed; border-radius:50%; filter:blur(130px); pointer-events:none; z-index:0; }
    .blob-1 { width:550px; height:550px; background:rgba(168,85,247,0.15); top:-150px; left:-150px; }
    .blob-2 { width:400px; height:400px; background:rgba(34,211,238,0.08); bottom:-80px; right:-80px; }
    nav { background:rgba(8,6,26,0.85); backdrop-filter:blur(20px); border-bottom:1px solid rgba(168,85,247,0.15); position:sticky; top:0; z-index:100; }
    .logo-text { background:linear-gradient(90deg,#a855f7,#22d3ee); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; font-weight:900; }
    .nav-link { color:#c4b5fd; font-weight:700; font-size:0.9rem; text-decoration:none; }

    /* ── HEADER ── */
    .kingdom-header { position:relative; width:100%; min-height:220px; display:flex; align-items:flex-end; overflow:hidden; }
    .kingdom-banner-img { position:absolute; inset:0; background-size:cover; background-position:center 30%; transition:transform 8s ease; }
    .kingdom-header:hover .kingdom-banner-img { transform:scale(1.03); }
    .kingdom-banner-overlay { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(8,6,26,0.1) 0%, rgba(8,6,26,0.55) 50%, rgba(8,6,26,0.97) 100%); }
    .kingdom-header-content { position:relative; z-index:2; width:100%; padding:2rem 2.5rem 1.5rem; max-width:1000px; margin:0 auto; }
    .kingdom-name { font-weight:900; font-size:clamp(2rem,5vw,3.2rem); line-height:1; color:#fff; letter-spacing:0.04em; text-shadow:0 0 40px var(--accent); text-transform:uppercase; }
    .kingdom-tagline { font-size:0.88rem; color:#94a3b8; margin-top:0.4rem; }

    /* ── LAYOUT AVEC GLOBE EN GRAND + POPUP MODAL ── */
    .kingdom-layout { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; padding:2rem 1rem; }

    /* Bouton toggle - en bas à gauche */
    .globe-toggle-btn {
      position:fixed;
      bottom:100px;
      left:20px;
      padding:0.75rem 1.5rem;
      background:transparent;
      border:none;
      border-bottom:2px solid rgba(168,85,247,0.3);
      cursor:pointer;
      font-size:0.9rem;
      font-weight:700;
      color:#c4b5fd;
      transition:all 0.6s cubic-bezier(0.34,1.56,0.64,1);
      z-index:20;
      display:inline-flex;
      align-items:center;
      gap:0.5rem;
      opacity:0;
      pointer-events:none;
      transform:translateY(20px);
    }
    .globe-toggle-btn.active {
      opacity:1;
      pointer-events:auto;
      transform:translateY(0);
    }
    .globe-toggle-btn:hover {
      border-bottom-color:rgba(168,85,247,0.7);
      color:#fff;
    }

    /* Contenu du bouton */
    .globe-content { display:none; }

    /* Popup modal - glassmorphisme grand central */
    .globe-modal {
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%) scale(0.9);
      width:min(600px, 90vw);
      background:rgba(15,10,26,0.75);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(168,85,247,0.3);
      border-radius:1.5rem;
      padding:1rem;
      box-shadow:0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
      opacity:0;
      pointer-events:none;
      transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
      z-index:300;
    }
    .globe-modal.active {
      opacity:1;
      pointer-events:auto;
      transform:translate(-50%, -50%) scale(1);
    }
    
    /* Overlay derrière modal */
    .globe-overlay {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(4px);
      opacity:0;
      pointer-events:none;
      transition:opacity 0.3s ease;
      z-index:250;
    }
    .globe-overlay.active {
      opacity:1;
      pointer-events:auto;
    }

    /* Close button */
    .modal-close {
      position:absolute;
      top:1.5rem;
      right:1.5rem;
      width:40px;
      height:40px;
      background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:50%;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.5rem;
      transition:all 0.3s ease;
      color:#94a3b8;
    }
    .modal-close:hover {
      background:rgba(255,255,255,0.15);
      color:#fff;
    }

    /* Titre du modal */
    .modal-title {
      font-size:1.3rem;
      font-weight:900;
      color:#fff;
      margin-bottom:0.75rem;
      text-align:left;
      letter-spacing:0.05em;
    }

    /* Image globe */
    @keyframes floatG { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    #globe-wrap {
      position:relative;
      transition:width 0.4s cubic-bezier(0.34,1.56,0.64,1), height 0.4s cubic-bezier(0.34,1.56,0.64,1);
      width:min(600px, 80vw);
      animation:floatG 6s ease-in-out infinite;
      margin:0 auto;
    }
    
    /* État compact (après sélection province) */
    #globe-wrap.compact {
      position:fixed !important;
      bottom:20px;
      left:20px;
      width:100px;
      height:100px;
      animation:none !important;
      margin:0 !important;
      z-index:100;
      transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1), 
                  height 0.6s cubic-bezier(0.34,1.56,0.64,1), 
                  bottom 0.6s cubic-bezier(0.34,1.56,0.64,1), 
                  left 0.6s cubic-bezier(0.34,1.56,0.64,1),
                  transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
      transform:none;
    }

    .globe-modal #globe-wrap {
      width:100%;
      max-width:500px;
      animation:none;
      margin:0 auto;
    }
    #globe-wrap.teleporting { transform:scale(1.3); filter:blur(12px) brightness(1.6); opacity:0; pointer-events:none; transition:transform 0.6s ease-in, filter 0.6s ease, opacity 0.6s ease; }

    .globe-img-modal { width:100%; display:block; filter:drop-shadow(0 0 30px rgba(34,211,238,0.2)); }
    .fresnel-modal { position:absolute; border-radius:50%; background:transparent; pointer-events:none; z-index:0;
      animation:fresnelP 4s ease-in-out infinite; }
    @keyframes fresnelP {
      0%,100%{box-shadow:0 0 30px 8px rgba(34,211,238,0.22),0 0 60px 18px rgba(168,85,247,0.15);}
      50%{box-shadow:0 0 45px 12px rgba(34,211,238,0.35),0 0 90px 28px rgba(168,85,247,0.22);}
    }

    /* Zones cliquables */
    .g-zone { position:absolute; width:140px; height:140px; border-radius:50%; transform:translate(-50%,-50%); cursor:pointer; transition:width 0.3s, height 0.3s; }
    .g-ring { position:absolute; inset:-5px; border-radius:50%; border:2px solid var(--col); box-shadow:0 0 14px var(--col); opacity:0; transition:opacity 0.3s, box-shadow 0.3s; }
    .g-dot  { position:absolute; inset:0; border-radius:50%; background:var(--col); opacity:0; transition:opacity 0.3s; }
    .g-zone:hover .g-dot  { opacity:0.25; }
    .g-zone:hover .g-ring { opacity:1; box-shadow:0 0 24px var(--col),0 0 48px var(--col); animation:gPulse 2s ease-in-out infinite; }
    @keyframes gPulse { 0%,100%{opacity:0.7} 50%{opacity:1} }
    .g-zone:hover { transform:translate(-50%,-50%) scale(1.08); }
    .g-tip { position:absolute; bottom:calc(100% + 14px); left:50%; transform:translateX(-50%) translateY(4px); text-align:center; opacity:0; transition:opacity 0.25s,transform 0.25s; pointer-events:none; white-space:nowrap; z-index:50; }
    .g-zone:hover .g-tip { opacity:1; transform:translateX(-50%) translateY(0); }
    .g-tip-name { font-size:15px; font-weight:900; color:#fff; text-shadow:0 0 12px var(--col),0 0 24px var(--col); letter-spacing:0.06em; text-transform:uppercase; }
    .g-tip-sub  { font-size:10px; color:rgba(196,181,253,0.7); margin-top:3px; font-weight:700; }

    /* Fog canvas */
    #globe-fog-canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:15; opacity:0; transition:opacity 0.35s; }
    #globe-fog-canvas-modal { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:15; opacity:0; transition:opacity 0.35s; }
    #globe-wrap.has-active #globe-fog-canvas { opacity:1; }
    #globe-wrap-modal.has-active #globe-fog-canvas-modal { opacity:1; }

    .globe-sidebar-label { font-size:10px; font-weight:800; color:rgba(196,181,253,0.4); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:0.4rem; text-align:center; }
    .globe-sidebar-province { font-size:11px; font-weight:800; color:#c4b5fd; margin-top:0.5rem; text-align:center; word-break:break-word; }

    /* ── MAP ── */
    .province-map-wrap { position:relative; width:100%; border-radius:1.25rem; margin-bottom:1rem; }
    .province-map-img { width:100%; display:block; border-radius:1.25rem; }
    .map-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .map-node-icon { transition:transform 0.2s ease; }
    @keyframes nodePulse { 0%,100%{opacity:0.7} 50%{opacity:1} }
    @keyframes neoFloat { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-8px)} }

    /* ── STICKY BAR ── */
    .sticky-bar { position:fixed; bottom:0; left:0; right:0; z-index:200; background:rgba(8,6,26,0.96); backdrop-filter:blur(20px); border-top:1px solid rgba(168,85,247,0.2); padding:0.75rem 1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .sticky-bar-track { width:100px; height:4px; background:rgba(255,255,255,0.08); border-radius:9999px; overflow:hidden; margin-top:4px; }
    .sticky-bar-fill { height:100%; border-radius:9999px; background:linear-gradient(90deg,var(--accent),var(--cyan)); transition:width 0.8s; }
    .btn-sos { display:inline-flex; align-items:center; gap:0.5rem; background:linear-gradient(135deg,#dc2626,#991b1b); border:none; border-radius:9999px; padding:0.6rem 1.4rem; font-weight:800; font-size:0.85rem; color:#fff; cursor:pointer; font-family:'Nunito',sans-serif; animation:sosPulse 2.5s ease-in-out infinite; }
    @keyframes sosPulse { 0%,100%{box-shadow:0 0 10px rgba(220,38,38,0.35)} 50%{box-shadow:0 0 24px rgba(220,38,38,0.7)} }
    @keyframes masterPulse { 0%,100%{box-shadow:0 0 12px rgba(34,211,238,0.4)} 50%{box-shadow:0 0 28px rgba(34,211,238,0.8)} }

    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:#08061a; }
    ::-webkit-scrollbar-thumb { background:linear-gradient(var(--violet),var(--cyan)); border-radius:3px; }

    @media (max-width:700px) {
      .globe-modal {
        width:min(600px, 95vw);
        padding:1.5rem;
      }
      #globe-wrap {
        width:min(500px, 75vw);
      }
      .globe-modal #globe-wrap {
        max-width:400px;
      }
    }
  </style>
</head>

<script>
  (function(){
    try {
      const p = JSON.parse(localStorage.getItem('neoquest_profile') || '{}');
      if(p.avatar) { const img = document.getElementById('nav-avatar'); if(img) { img.src = p.avatar; if(p.avatarStyle) img.style.filter = p.avatarStyle; } }
      if(p.pseudo) { const el = document.getElementById('nav-pseudo'); if(el) el.textContent = p.pseudo; }
    } catch(e) {}
    try {
      const xp  = (typeof nqGetXP === 'function') ? nqGetXP() : 0;
      const lvl = (typeof nqGetLevel === 'function') ? nqGetLevel(xp) : {level:1,title:'Curieux Éveillé',color:'#22d3ee'};
      const pct = (typeof nqGetLevelProgress === 'function') ? nqGetLevelProgress(xp) : 0;
      document.getElementById('nav-level-badge').textContent = lvl.level;
      document.getElementById('nav-level-badge').style.background = lvl.color;
      document.getElementById('nav-level-title').textContent = lvl.title;
      document.getElementById('nav-level-title').style.color = lvl.color;
      document.getElementById('nav-xp-bar').style.width = pct + '%';
      document.getElementById('nav-xp-bar').style.background = lvl.color;
      document.getElementById('nav-hero-info').style.display = 'block';
    } catch(e) {}
  })();
</script>

<script>
  // ── Modal globe ──
  function openGlobeModal(event) {
    event.stopPropagation();
    const modal = document.getElementById('globe-modal');
    const overlay = document.getElementById('globe-overlay');
    modal.classList.add('active');
    overlay.classList.add('active');
    // Refresh du fresnel modal et placement des zones
    setTimeout(() => {
      placeFresnelModal();
      placeZonesModal();
    }, 100);
  }

  function closeGlobeModal() {
    const modal = document.getElementById('globe-modal');
    const overlay = document.getElementById('globe-overlay');
    modal.classList.remove('active');
    overlay.classList.remove('active');
  }

  // Fermer si clic sur overlay
  document.addEventListener('click', (e) => {
    const modal = document.getElementById('globe-modal');
    const overlay = document.getElementById('globe-overlay');
    if (overlay.classList.contains('active') && e.target === overlay) {
      closeGlobeModal();
    }
  });

  // Fermer au clic Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeGlobeModal();
    }
  });

  // ── Fresnel pour globe principal ──
  function placeFresnel() {
    const img = document.getElementById('globe-img');
    const fr  = document.getElementById('fresnel-modal');
    if (!img || !fr || !img.offsetWidth || !img.naturalWidth) return;
    
    const iw = img.offsetWidth;
    const ih = img.offsetHeight;
    const r  = ih * 0.40;
    const cx = iw * 0.5;
    const cy = ih * 0.5;
    
    fr.style.width  = (r*2) + 'px';
    fr.style.height = (r*2) + 'px';
    fr.style.left   = (cx - r) + 'px';
    fr.style.top    = (cy - r) + 'px';
  }

  // ── Fresnel pour globe modal ──
  function placeFresnelModal() {
    const img = document.getElementById('globe-img-modal');
    const fr  = document.getElementById('fresnel-modal-modal');
    if (!img || !fr || !img.offsetWidth || !img.naturalWidth) return;
    
    const iw = img.offsetWidth;
    const ih = img.offsetHeight;
    const r  = ih * 0.40;
    const cx = iw * 0.5;
    const cy = ih * 0.5;
    
    fr.style.width  = (r*2) + 'px';
    fr.style.height = (r*2) + 'px';
    fr.style.left   = (cx - r) + 'px';
    fr.style.top    = (cy - r) + 'px';
  }

  // ── Fog pour globe principal ──
  let _persistentZone = null;
  let _persistentZoneModal = null;

  // ── Placer zones du modal en fonction de la taille réelle de l'image ──
  function placeZonesModal() {
    const img = document.getElementById('globe-img-modal');
    const wrap = document.getElementById('globe-wrap-modal');
    if (!img || !img.offsetWidth || !img.offsetHeight) {

  function drawFog(activeZone, persist) {
    const fogCanvas = document.getElementById('globe-fog-canvas');
    const globeImg  = document.getElementById('globe-img');
    const wrap      = document.getElementById('globe-wrap');
    if (!fogCanvas || !globeImg) return;

    if (persist) { _persistentZone = activeZone; }
    const zone = activeZone || _persistentZone;

    const iw = globeImg.offsetWidth, ih = globeImg.offsetHeight;
    fogCanvas.width = iw; fogCanvas.height = ih;
    const ctx = fogCanvas.getContext('2d');
    ctx.clearRect(0, 0, iw, ih);

    if (!zone) { wrap.classList.remove('has-active'); return; }
    wrap.classList.add('has-active');

    const cx = parseFloat(zone.style.left) / 100 * iw;
    const cy = parseFloat(zone.style.top)  / 100 * ih;
    const r = iw * 0.15;

    ctx.fillStyle = 'rgba(8,6,26,0.7)';
    ctx.fillRect(0, 0, iw, ih);
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    const grad = ctx.createRadialGradient(cx, cy, r*0.3, cx, cy, r*1.5);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r*1.5, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

      if (d.pts >= 200) return 'mastered';
      if (d.pts > 0 || d.quizDone > 0) return 'in-progress';
      return 'not-started';
    } catch { return 'not-started'; }

  function renderMapRoute(niveau, c, mapImg, lastActiveIdx, neoSrc, container) {
    const allChaps = niveau.themes?.flatMap(t => t.chapitres) || [];
    const positions = MAP_NODE_POSITIONS[niveau.id] || MAP_NODE_POSITIONS.default;

    // Wrapper identique au test_map.html qui fonctionne
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;display:inline-block;width:100%;margin-bottom:1rem;border-radius:1rem;overflow:hidden;';

    const img = document.createElement('img');
    img.src = mapImg;

    wrap.appendChild(img);

    // SVG chemins
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;';
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('preserveAspectRatio','none');
    wrap.appendChild(svg);

    // Filtres CSS précalculés pour coloriser paw.png (image noire)
    function colorFilter(color, lit) {
      if (!lit) return 'brightness(0) invert(1)';
      const map = {
        '#ffffff': 'brightness(0) invert(1)',
        '#a855f7': 'brightness(0) saturate(100%) invert(42%) sepia(93%) saturate(1000%) hue-rotate(252deg) brightness(103%) contrast(96%)',
        '#22c55e': 'brightness(0) saturate(100%) invert(59%) sepia(75%) saturate(450%) hue-rotate(95deg) brightness(98%) contrast(93%)',
        '#f97316': 'brightness(0) saturate(100%) invert(55%) sepia(94%) saturate(800%) hue-rotate(6deg) brightness(103%) contrast(97%)',
        '#22d3ee': 'brightness(0) saturate(100%) invert(78%) sepia(60%) saturate(500%) hue-rotate(155deg) brightness(100%) contrast(97%)',
        '#f472b6': 'brightness(0) saturate(100%) invert(62%) sepia(80%) saturate(600%) hue-rotate(295deg) brightness(103%) contrast(95%)',
        '#facc15': 'brightness(0) saturate(100%) invert(85%) sepia(60%) saturate(800%) hue-rotate(5deg) brightness(105%) contrast(97%)',
      };
      return map[color] || 'brightness(0) invert(1)';
    }

    function drawPaw(wrap, iw, ih, cx, cy, angle, lit, color) {
      const el = document.createElement('img');
      el.src = 'img/paw.png';
      el.className = 'paw-print';
      const sizePx = Math.round(iw * 0.022);
      const pxX = cx / 100 * iw;
      const pxY = cy / 100 * ih;
      el.style.cssText = `
        position:absolute;
        left:${pxX}px; top:${pxY}px;
        width:${sizePx}px; height:${sizePx}px;
        transform:translate(-50%,-50%) rotate(${(angle * 180/Math.PI).toFixed(1)}deg);
        filter:${colorFilter(color, lit)};
        opacity:${lit ? 1 : 0.3};
        pointer-events:none;
        z-index:5;
      `;
      wrap.appendChild(el);
    }

    const pawsToDraw = [];
    allChaps.forEach((chap, i) => {
      if (i === 0) return;
      const prev = positions[i-1] || [50,50];
      const curr = positions[i]   || [50,50];
      const prevStatut = getStatut(allChaps[i-1].id);
      const lit = prevStatut === 'mastered';
      const pawColor = lit ? c : '#ffffff';

      // Interpoler 4 pattes entre les deux nodes
      // Distance réelle en pixels (image 2744x1568)
      const IW = 2744, IH = 1568;
      const dpx = (curr[0]-prev[0])/100 * IW;
      const dpy = (curr[1]-prev[1])/100 * IH;
      const distPx = Math.sqrt(dpx*dpx + dpy*dpy);
      // 1 patte tous les 50px réels = trail plus dense et fluide
      const steps = Math.max(4, Math.round(distPx / 50));
      for (let s = 0; s < steps; s++) {
        const t  = (s + 0.5) / steps;
        const mx = (prev[0]+curr[0])/2;
        const my = (prev[1]+curr[1])/2 - 3;
        const bx = (1-t)*(1-t)*prev[0] + 2*(1-t)*t*mx + t*t*curr[0];
        const by = (1-t)*(1-t)*prev[1] + 2*(1-t)*t*my + t*t*curr[1];
        const dtx = 2*(1-t)*(mx-prev[0]) + 2*t*(curr[0]-mx);
        const dty = 2*(1-t)*(my-prev[1]) + 2*t*(curr[1]-my);
        const angle = Math.atan2(dty * IH, dtx * IW) + Math.PI/2;
        // Offset gauche/droite en % équivalent à ~30px réels
        const offsetPctX = (30 / IW) * 100;
        const offsetPctY = (30 / IH) * 100;
        const offsetDir = (s % 2 === 0 ? 1.0 : -1.0);
        const px = bx + offsetDir * offsetPctX * Math.cos(angle - Math.PI/2);
        const py = by + offsetDir * offsetPctY * Math.sin(angle - Math.PI/2);
        pawsToDraw.push({px, py, angle, lit, color: pawColor});
      }
    });

    // Créer les nodes AVANT de les positionner
    const nodes = [];
    allChaps.forEach((chap, i) => {
      const statut  = getStatut(chap.id);
      const isEmpty = (chap.quiz?.length||0)===0 && (chap.flashcards?.length||0)===0;
      const isNeo   = (i === lastActiveIdx);
      const loot    = chap.loot_quete || null;
      const pionSrc = QUEST_PIONS[chap.id];

      let pionFilter = (isEmpty || statut==='not-started') ? 'grayscale(0.85) brightness(0.6) opacity(0.7)' : '';
      let fogHTML = '';
      let pionAnim   = statut==='in-progress' ? 'nodePulse 2s ease-in-out infinite' : 'none';
      let pionGlow   = statut==='mastered'
        ? 'drop-shadow(0 0 8px #fbbf24) drop-shadow(0 0 20px #f59e0b) drop-shadow(0 0 40px rgba(251,191,36,0.6))'
        : statut==='in-progress' ? `drop-shadow(0 0 8px ${c}) drop-shadow(0 0 18px ${c})` : '';
      let checkmark = '';

      const lootTip  = loot ? `<div style="font-size:0.62rem;color:#fbbf24;font-weight:800;margin-top:3px;">${loot.emoji} ${loot.nom}</div>` : '';
      const ctaBtn   = isEmpty ? '' : `<div style="margin-top:5px;font-size:0.65rem;font-weight:800;color:${c};">Commencer →</div>`;

      const node = document.createElement('div');
      node.dataset.idx = i;
      node.style.cssText = 'position:absolute;transform:translate(-50%,-50%);z-index:10;cursor:' + (isEmpty?'default':'pointer') + ';';
      node.innerHTML = `
        ${isNeo ? `<img src="${neoSrc}" style="position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 0 8px ${c});animation:neoFloat 2.5s ease-in-out infinite;pointer-events:none;"/>` : ''}
        <div style="position:relative;">
          ${pionSrc
            ? `<img src="${pionSrc}" style="width:64px;height:64px;object-fit:contain;filter:${pionGlow};animation:${pionAnim};transition:transform 0.2s;display:block;"/>`
            : `<div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:1.8rem;">${chap.icone_quete||'📍'}</div>`
          }
          ${fogHTML}
          ${checkmark}
        </div>
        <div class="map-tooltip" style="
          position:absolute;
          bottom:calc(100% + 10px);
          left:50%;
          transform:translateX(-50%);
          min-width:140px;
          max-width:180px;
          background:rgba(8,6,26,0.88);
          backdrop-filter:blur(20px);
          -webkit-backdrop-filter:blur(20px);
          border:1px solid rgba(168,85,247,0.4);
          border-radius:0.85rem;
          padding:10px 14px;
          opacity:0;
          transition:opacity 0.2s, transform 0.2s;
          pointer-events:none;
          z-index:200;
          text-align:center;
          white-space:nowrap;
          box-shadow:0 8px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
        ">
          <div style="font-size:0.75rem;font-weight:900;color:#fff;line-height:1.3;">${chap.nom_quete||chap.nom}</div>
          ${lootTip}${ctaBtn}
          <div style="position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(168,85,247,0.4);"></div>
        </div>
      `;

      node.addEventListener('mouseenter', () => {
        node.style.zIndex = '500';
        const tip = node.querySelector('.map-tooltip');
        // Détection viewport-aware du tooltip position
        const nodeTop = parseFloat(node.style.top);
        const nodeLeft = parseFloat(node.style.left);
        const ih = img.offsetHeight;
        const iw = img.offsetWidth;
        const tipHeight = 100; // ~hauteur estimée du tooltip
        const tipWidth = 180;
        
        // Si node en haut (< 20% du viewport) → tooltip dessous
        if (nodeTop < ih * 0.20) {
          tip.style.bottom = 'auto';
          tip.style.top = 'calc(100% + 10px)';
          const arrow = tip.querySelector('div[style*="border-top-color"]');
          if (arrow) {
            arrow.style.borderTopColor = 'transparent';
            arrow.style.borderBottomColor = 'rgba(168,85,247,0.4)';
            arrow.style.top = 'auto';
            arrow.style.bottom = '100%';
          }
        }
        // Si node trop à droite → décaler tooltip à gauche
        if (nodeLeft + tipWidth/2 > iw * 0.95) {
          tip.style.transform = 'translateX(-80%)';
        } else if (nodeLeft - tipWidth/2 < iw * 0.05) {
          tip.style.transform = 'translateX(-20%)';
        } else {
          tip.style.transform = 'translateX(-50%)';
        }
        tip.style.opacity = '1';
        const img2 = node.querySelector('img[style*="64px"]');
        if(img2) img2.style.transform = 'scale(1.15)';
      });
      node.addEventListener('mouseleave', () => {
        node.style.zIndex = '10';
        const tip = node.querySelector('.map-tooltip');
        tip.style.opacity = '0';
        const img2 = node.querySelector('img[style*="64px"]');
        if(img2) img2.style.transform = 'scale(1)';
      });
      if (!isEmpty) {
        node.addEventListener('click', () => {
          window.location.href = `chapitre.html?matiere=${matiereId}&niveau=${niveau.id}&chapitre=${chap.id}`;
        });
      }

      wrap.appendChild(node);
      nodes.push(node);
    });

    // Positionner en px exactement comme test_map.html
    function placeNodes() {
      const iw = img.offsetWidth;
      const ih = img.offsetHeight;
      // Vérifier que l'image est chargée ET a ses dimensions naturelles
      if (!iw || !ih || !img.naturalWidth || !img.naturalHeight) { 
        setTimeout(placeNodes, 100); 
        return; 
      }
      // Placer les nodes
      nodes.forEach((node, i) => {
        const pos = positions[i] || [50,50];
        node.style.left = (pos[0]/100 * iw) + 'px';
        node.style.top  = (pos[1]/100 * ih) + 'px';
      });
      // Dessiner les pattes
      wrap.querySelectorAll('.paw-print').forEach(p => p.remove());
      pawsToDraw.forEach(({px, py, angle, lit, color}) => {
        drawPaw(wrap, iw, ih, px, py, angle, lit, color || c);
        wrap.lastChild.classList.add('paw-print');
      });
    }

    img.addEventListener('load', placeNodes);
    window.addEventListener('resize', placeNodes);
    if (img.complete && img.naturalWidth && img.naturalHeight) placeNodes();
    else setTimeout(placeNodes, 400);

    container.appendChild(wrap);

    // Loots de régions
    niveau.themes?.forEach(theme => {
      if (!theme.loot_region) return;
      const themeChaps  = theme.chapitres || [];
      const allMastered = themeChaps.length > 0 && themeChaps.every(ch => getStatut(ch.id) === 'mastered');
      const loot = theme.loot_region;
      const lootEl = document.createElement('div');
      lootEl.style.cssText = 'text-align:center;margin-bottom:0.75rem;';
      lootEl.innerHTML = `
        <div style="display:inline-flex;align-items:center;gap:0.5rem;
          background:${allMastered?'rgba(250,204,21,0.12)':'rgba(255,255,255,0.03)'};
          border:1px solid ${allMastered?'rgba(250,204,21,0.45)':'rgba(255,255,255,0.08)'};
          border-radius:9999px;padding:5px 16px;font-size:0.7rem;font-weight:800;
          color:${allMastered?'#fbbf24':'#334155'};">
          ${loot.emoji} ${theme.icone_region} ${theme.nom_region} — ${allMastered ? loot.nom : '??? Récompense bloquée'}
        </div>`;
      container.appendChild(lootEl);
    });
  }

  function renderZigzag(niveau, c, lastActiveIdx, neoSrc, container) {
    const route = document.createElement('div');
    route.className = 'quest-route';

    const STATUS_ICON  = {'not-started':'📖','in-progress':'⚡','mastered':'✅'};
    const STATUS_LABEL = {'not-started':'Pas commencé','in-progress':'En cours','mastered':'Maîtrisé'};
    const STATUS_COL   = {'not-started':'rgba(255,255,255,0.1)','in-progress':'#fbbf24','mastered':'#22d3ee'};

    let globalIdx = 0;
    niveau.themes?.forEach(theme => {
      const regionNom  = theme.nom_region  || theme.nom;
      const regionIcon = theme.icone_region || '📍';
      const loot       = theme.loot_region  || null;
      const themeChaps = theme.chapitres || [];
      const allMastered = themeChaps.length > 0 && themeChaps.every(ch => getStatut(ch.id) === 'mastered');
      const lootHTML = loot ? `
        <div style="display:inline-flex;align-items:center;gap:0.4rem;margin-top:0.5rem;
          background:${allMastered?'rgba(250,204,21,0.12)':'rgba(255,255,255,0.04)'};
          border:1px solid ${allMastered?'rgba(250,204,21,0.5)':'rgba(255,255,255,0.08)'};
          border-radius:9999px;padding:3px 12px;font-size:0.62rem;font-weight:800;
          color:${allMastered?'#fbbf24':'#334155'};">
          ${loot.emoji} ${allMastered ? loot.nom : '??? Objet légendaire'}
        </div>` : '';

      const lbl = document.createElement('div');
      lbl.className = 'theme-label';
      lbl.innerHTML = `
        <div style="display:inline-flex;flex-direction:column;align-items:center;gap:0.4rem;">
          <span style="font-size:0.68rem;font-weight:800;color:${c};text-transform:uppercase;letter-spacing:0.1em;background:${c}18;border:1px solid ${c}33;border-radius:9999px;padding:4px 16px;">
            ${regionIcon} ${regionNom}
          </span>
          ${lootHTML}
        </div>`;
      route.appendChild(lbl);

      theme.chapitres.forEach(chap => {
        const statut  = getStatut(chap.id);
        const pts     = getPts(chap.id);
        const pct2    = Math.min(100, Math.round((pts/200)*100));
        const isEmpty = (chap.quiz?.length||0)===0 && (chap.flashcards?.length||0)===0;
        const isNeo   = (globalIdx === lastActiveIdx);
        const isEven  = globalIdx % 2 === 0;
        const thumbBg = chap.youtube ? `background-image:url('https://img.youtube.com/vi/${chap.youtube}/mqdefault.jpg');` : '';
        const href    = isEmpty ? '#' : `chapitre.html?matiere=${matiereId}&niveau=${niveau.id}&chapitre=${chap.id}`;

        const cardHTML = `
          <a href="${href}" class="quest-card ${isEmpty?'empty':statut}">
            <div class="quest-card-thumb" style="${thumbBg}"></div>
            <div class="quest-card-inner">
              <div class="quest-card-num">${chap.icone_quete||'📍'} Quête ${globalIdx+1}</div>
              <div class="quest-card-name">${chap.nom_quete || chap.nom}</div>
              <span class="quest-status-pill ${isEmpty?'not-started':statut}">
                ${isEmpty ? '🚧 Bientôt' : STATUS_LABEL[statut]}
              </span>
              ${statut!=='not-started'&&!isEmpty?`<div class="quest-progress-bar"><div class="quest-progress-fill" style="width:${pct2}%;background:${STATUS_COL[statut]};"></div></div>`:''}
            </div>
          </a>`;

        const dotHTML = `
          <div class="quest-node-center">
            ${isNeo ? `<img class="neo-on-map" src="${neoSrc}" alt="Neo" />` : ''}
            <div class="quest-node-dot ${isEmpty?'empty':statut}">
              ${isEmpty ? '🔒' : STATUS_ICON[statut]}
            </div>
          </div>`;
        const spacer = `<div class="quest-spacer"></div>`;
        const node = document.createElement('div');
        node.className = 'quest-node';
        node.innerHTML = isEven ? cardHTML + dotHTML + spacer : spacer + dotHTML + cardHTML;
        route.appendChild(node);
        globalIdx++;
      });
    });
    container.appendChild(route);
  }

  function launchSOSQuiz() {
    if (!currentNiveau) return;
    const active = currentNiveau.themes?.flatMap(t=>t.chapitres).filter(ch =>
      localStorage.getItem(`neoquest_chap_${ch.id}`) && (ch.quiz?.length||0) > 0
    ) || [];
    if (active.length === 0) { alert('Complète au moins une quête pour débloquer le SOS Contrôle !'); return; }
    window.location.href = `chapitre.html?matiere=${matiereId}&niveau=${currentNiveau.id}&chapitre=${active[0].id}`;
  }

</script>
<script>
  if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
