<nav class="w-full px-6 py-3 flex items-center justify-between">
  <a href="index_hidden.html" class="flex items-center gap-2 no-underline">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="15" stroke="url(#lg)" stroke-width="1.5"/><circle cx="16" cy="16" r="3" fill="url(#lg)"/><path d="M9 12L16 8L23 12L23 20L16 24L9 20Z" stroke="url(#lg)" stroke-width="1.5" fill="none"/><defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
    <span class="logo-text text-xl">NeoQuest TV</span>
  </a>
  <a href="index_hidden.html" class="nav-link">← Multivers</a>
  <a href="profil.html" id="nav-profile" style="display:flex;align-items:center;gap:10px;text-decoration:none;background:rgba(0,0,0,0.35);border:1px solid rgba(168,85,247,0.25);border-radius:9999px;padding:5px 14px 5px 5px;" onmouseover="this.style.borderColor='rgba(168,85,247,0.55)'" onmouseout="this.style.borderColor='rgba(168,85,247,0.25)'">
    <div style="position:relative;flex-shrink:0;">
      <img id="nav-avatar" src="img/Neo_assis.png" alt="Profil" style="width:36px;height:36px;object-fit:contain;border-radius:50%;border:2px solid #22d3ee;background:rgba(168,85,247,0.15);padding:2px;" />
      <div id="nav-level-badge" style="position:absolute;bottom:-2px;right:-4px;background:#22d3ee;color:#08061a;font-size:9px;font-weight:900;padding:1px 5px;border-radius:9999px;border:1.5px solid #08061a;line-height:1.4;">1</div>
    </div>
    <div style="display:none;" id="nav-hero-info">
      <div id="nav-level-title" style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;line-height:1;"></div>
      <div id="nav-pseudo" style="font-size:13px;font-weight:900;color:#fff;line-height:1.3;">Héros</div>
      <div style="width:72px;height:3px;background:rgba(255,255,255,0.08);border-radius:9999px;margin-top:3px;overflow:hidden;">
        <div id="nav-xp-bar" style="height:100%;border-radius:9999px;background:#22d3ee;box-shadow:0 0 8px #22d3ee;width:0%;transition:width 0.8s ease;"></div>
      </div>
    </div>
  </a>
</nav>
<script>
  (function(){
    try {
      const p = JSON.parse(localStorage.getItem('neoquest_profile') || '{}');
      if(p.avatar) { const img = document.getElementById('nav-avatar'); if(img) { img.src = p.avatar; if(p.avatarStyle) img.style.filter = p.avatarStyle; } }
      if(p.pseudo) { const el = document.getElementById('nav-pseudo'); if(el) el.textContent = p.pseudo; }
    } catch(e) {}
    try {
      const xp  = (typeof nqGetXP === 'function') ? nqGetXP() : 0;
      const lvl = (typeof nqGetLevel === 'function') ? nqGetLevel(xp) : {level:1,title:'Curieux Éveillé',color:'#22d3ee'};
      const pct = (typeof nqGetLevelProgress === 'function') ? nqGetLevelProgress(xp) : 0;
      document.getElementById('nav-level-badge').textContent = lvl.level;
      document.getElementById('nav-level-badge').style.background = lvl.color;
      document.getElementById('nav-level-title').textContent = lvl.title;
      document.getElementById('nav-level-title').style.color = lvl.color;
      document.getElementById('nav-xp-bar').style.width = pct + '%';
      document.getElementById('nav-xp-bar').style.background = lvl.color;
      document.getElementById('nav-hero-info').style.display = 'block';
    } catch(e) {}
  })();
</script>

<!-- Header Royaume -->
<div class="kingdom-header">
  <div class="kingdom-banner-img" id="kingdom-banner-img"></div>

  </div>
</div>

<!-- Overlay pour modal -->

<!-- Modal glassmorphisme -->
<div class="globe-modal" id="globe-modal">

  <div id="globe-wrap-modal" style="position:relative;">
    <div class="fresnel-modal" id="fresnel-modal-modal"></div>

  <div class="globe-sidebar-province" id="sidebar-province-label-modal" style="margin-top:0.75rem;font-size:0.9rem;"></div>
</div>

<!-- Layout principal -->
<div class="kingdom-layout" id="kingdom-layout">

  <!-- Globe en grand -->
  <div id="globe-wrap" style="position:relative;">
    <div class="fresnel-modal" id="fresnel-modal"></div>
    <img class="globe-img-modal" id="globe-img" src="img/historyaglobe.png" alt="Planète Historya"/>
    <canvas id="globe-fog-canvas"></canvas>
  </div>

  <!-- Corps : map + quêtes -->
  <div class="kingdom-body">
    <div id="quest-route-container"></div>
    <div id="empty-state" style="display:none;text-align:center;padding:4rem 0;">
      <div style="font-size:3rem;margin-bottom:1rem;">🚧</div>
      <p style="font-weight:900;font-size:1.2rem;color:#fff;margin-bottom:0.5rem;">Province en préparation</p>
      <p style="color:#64748b;">Reviens bientôt, Neo prépare les quêtes !</p>
    </div>
  </div>

</div>

<!-- Sticky bar -->
<div class="sticky-bar">
  <div>
    <div style="font-size:0.8rem;color:#94a3b8;font-weight:700;"><strong id="sticky-visited" style="color:#fff;">0</strong>/<span id="sticky-total">0</span> Quêtes · <span id="sticky-kingdom-name" style="color:var(--accent);"></span></div>
    <div class="sticky-bar-track"><div class="sticky-bar-fill" id="sticky-fill" style="width:0%"></div></div>
  </div>
  <button class="btn-sos" onclick="openGlobeModal(event)">🌍 Changer de Province</button>
</div>
